name: Daily Notion Stock Sync

on:
  schedule:
    # 한국 시간 기준 평일 매일 오후 4시 30분 자동 실행 (UTC 07:30)
    - cron: '30 7 * * 1-5'
  # 원할 때 수동으로 즉시 실행 버튼 활성화
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Dependencies
        run: |
          pip install requests beautifulsoup4 yfinance notion-client
      - name: Run Stock Sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: python main.py
